name: ci

on:
  push:
    branches: [rapp, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs]"

      - name: Ruff lint
        run: ruff check src tests examples

      - name: Ruff format check
        run: ruff format --check src tests examples

      - name: Mypy
        run: mypy src

      - name: Pytest (with coverage gate)
        run: pytest

      - name: Sphinx docs build
        run: sphinx-build -b html docs docs/_build -W --keep-going

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint helm/template-app
      - name: Helm template (render)
        run: helm template rapp helm/template-app --set secrets.RAPP_INTENT_SECRET=ci-test
